# Render Blueprint for research-b
# Provisions: Next.js web, Python FastAPI worker, Postgres (pgvector), Redis
# Apply via Render dashboard → Blueprints → New Blueprint Instance

databases:
  - name: research-b-db
    plan: basic-256mb        # bump to basic-1gb once you have real data
    postgresMajorVersion: 16
    # pgvector ships with Render Postgres 16 — you still need to enable it once:
    # psql $DATABASE_URL -c 'CREATE EXTENSION IF NOT EXISTS vector;'

services:
  # ---------- Redis (key-value) ----------
  - type: redis
    name: research-b-redis
    plan: free               # 25MB; upgrade if you start caching scrape results
    ipAllowList: []          # private; only services in this workspace can reach it
    maxmemoryPolicy: allkeys-lru

  # ---------- Next.js web app ----------
  - type: web
    name: research-b-web
    runtime: node
    plan: starter            # $7/mo; required so it doesn't sleep
    region: oregon           # match all services to the same region
    rootDir: .
    buildCommand: |
      corepack enable && \
      corepack prepare pnpm@9.15.0 --activate && \
      pnpm install --frozen-lockfile && \
      pnpm --filter @peptideiq/web exec prisma generate && \
      pnpm --filter @peptideiq/web exec prisma db push --accept-data-loss && \
      pnpm --filter @peptideiq/web build
    startCommand: pnpm --filter @peptideiq/web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: research-b-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: research-b-redis
          property: connectionString
      # Set this manually in the dashboard after first deploy.
      # Use the worker's INTERNAL URL: http://research-b-worker:10000
      - key: WORKER_API_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false           # e.g. https://research-b-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false

  # ---------- Python FastAPI worker ----------
  - type: web
    name: research-b-worker
    runtime: python
    plan: standard           # $25/mo; Playwright + scrapers need the RAM
    region: oregon
    rootDir: apps/workers
    buildCommand: |
      pip install --upgrade pip && \
      pip install -r requirements.txt && \
      playwright install chromium
    startCommand: python main.py --api --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: research-b-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: research-b-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: PeptideIQ/1.0
      - key: YOUTUBE_API_KEY
        sync: false
      - key: MOCK_MODE
        value: "false"