# Render Blueprint for research-b ($7/mo budget tier)
# Stack: Next.js web (starter, always-on) + Python FastAPI worker (free, sleeps)
# Database: Neon (external, free tier) — set DATABASE_URL manually after deploy

services:
  # ---------- Next.js web app ($7/mo, always-on) ----------
  - type: web
    name: research-b-web
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: |
      corepack enable && \
      corepack prepare pnpm@9.15.0 --activate && \
      pnpm install --frozen-lockfile && \
      pnpm --filter @peptideiq/web exec prisma generate && \
      pnpm --filter @peptideiq/web exec prisma db push --accept-data-loss && \
      pnpm --filter @peptideiq/web build
    startCommand: pnpm --filter @peptideiq/web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      # Neon connection string. Set in dashboard → Environment.
      - key: DATABASE_URL
        sync: false
      # Worker public URL: https://research-b-worker.onrender.com
      - key: WORKER_API_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false

  # ---------- Python FastAPI worker (free, sleeps after 15min idle) ----------
  - type: web
    name: research-b-worker
    runtime: python
    plan: free
    region: oregon
    rootDir: apps/workers
    buildCommand: |
      pip install --upgrade pip && \
      pip install -r requirements.txt
    # NOTE: skipping `playwright install chromium` — free tier RAM (512MB)
    # is too tight for headless Chrome. BHW scraper will only work in MOCK_MODE.
    startCommand: python main.py --api --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        sync: false           # same Neon URL as web
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: PeptideIQ/1.0
      - key: YOUTUBE_API_KEY
        sync: false
      # Start with mock mode true so you can verify deploy works before
      # plugging in real API credentials. Flip to "false" once everything's wired.
      - key: MOCK_MODE
        value: "true"